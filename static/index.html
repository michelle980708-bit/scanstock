<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ScanStock Pro 電腦端</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .loading { color: gray; }
    </style>
</head>
<body>
    <h1>ScanStock Pro 電腦端</h1>
    <p>商品列表（從資料庫讀取）</p>
    
    <div id="product-list" class="loading">載入中...</div>

    <script>
        // 定義 API 的網址（將來手機 App 也會用同樣的 API）
        const API_BASE = "http://localhost:8000";
        
        async function loadProducts() {
            const container = document.getElementById('product-list');
            try {
                const response = await fetch(`${API_BASE}/api/products`);
                if (!response.ok) throw new Error('API 回應錯誤');
                const products = await response.json();
                
                if (products.length === 0) {
                    container.innerHTML = '<p>暫無商品資料</p>';
                    return;
                }
                
                // 建立 HTML 表格
                let html = '<table><thead><tr>';
                html += '<th>ID</th><th>條碼</th><th>名稱</th><th>分類</th><th>數量</th><th>位置</th>';
                html += '</tr></thead><tbody>';
                
                for (const p of products) {
                    html += `<tr>
                        <td>${p.id}</td>
                        <td>${p.barcode}</td>
                        <td>${p.name}</td>
                        <td>${p.category}</td>
                        <td>${p.quantity}</td>
                        <td>${p.location || '-'}</td>
                    </tr>`;
                }
                html += '</tbody></table>';
                container.innerHTML = html;
            } catch (error) {
                console.error('載入失敗:', error);
                container.innerHTML = '<p style="color:red">無法載入商品列表，請確認伺服器已啟動。</p>';
            }
        }
        
        // 頁面載入完成後執行
        loadProducts();
    </script>
</body>
</html>
